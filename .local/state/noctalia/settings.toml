config_version = 14

[accessibility]
ui_scale = 1.2

[bar.default]
background_opacity = 0.0
capsule = true
capsule_border = "outline"
capsule_opacity = 0.59999999999999998
capsule_padding = 8.0
capsule_thickness = 1.0
center = []
color = "primary"
end = [ "jcorbin/model-usage:indicator", "group:g3", "group:g2", "airpods", "group:g4" ]
icon_color = "secondary"
margin_edge = 4
margin_ends = 4
padding = 10
radius = 0
scale = 1.1000000000000001
start = [ "clock", "group:g1", "taskbar" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "cpu", "temp", "ram" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = "outline"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "network", "airpods_2", "bluetooth", "brightness", "volume" ]
    opacity = 0.60000002384185791
    padding = 8.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = "outline"
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "caffeine", "notifications", "clipboard", "tray" ]
    opacity = 0.60000002384185791
    padding = 8.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = "outline"
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "power_profile", "battery", "jcorbin/whatcable:indicator" ]
    opacity = 0.60000002384185791
    padding = 8.0

