[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 900.49859619140625
    cy = 1081.2969970703125
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1800.0
    rotation = 0.0
