        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."harveywuk/airpods"]
ctl_path = "/usr/bin/librepods-ctl"

[plugins]
enabled = [ "jcorbin/model-usage", "jcorbin/whatcable", "harveywuk/airpods" ]

[shell]
clipboard_auto_paste = "off"
launch_apps_as_systemd_services = true
niri_overview_type_to_launch_enabled = true
polkit_agent = true
time_format = "{:%H:%M:%S}"

    [shell.launcher]
    compact = true

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    launcher_position = "auto"
    open_near_click_control_center = true
    open_near_click_launcher = true
    polkit_placement = "attached"
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    save_to_file = false

[theme]
builtin = "Eldritch"
community_palette = "Oxocarbon"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "ghostty", "niri", "qt", "starship" ]

[wallpaper]
directory = "/usr/share/wallpapers"
directory_dark = "/usr/share/wallpapers"
directory_light = "/usr/share/wallpapers"

    [wallpaper.default]
    path = "/usr/share/wallpapers/cachyos-wallpapers/Cachy depths 5K.png"

    [wallpaper.last]
    path = "/usr/share/wallpapers/cachyos-wallpapers/Cachy depths 5K.png"

    [wallpaper.monitors.eDP-1]
    path = "/usr/share/wallpapers/cachyos-wallpapers/Cachy depths 5K.png"

[widget.airpods]
type = "harveywuk/airpods:airpods"

[widget.airpods_2]
type = "harveywuk/airpods:airpods"

[widget.clock]
format = "{:%Y-%m-%dT%H:%M:%S%z}"

[widget.network]
show_label = false

[widget.taskbar]
anchor = true
only_active_workspace = true
show_window_title = true
taskbar_max_width = 500
window_title_max_width = 75

[widget.workspaces]
style = "minimal"