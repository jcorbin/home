# Change my prefix to Ctrl-u, since that's a strong home row key on dvorak.
set -g prefix C-u
unbind C-b
bind-key u send-prefix

# Clipboard: copies in copy-mode (and apps' OSC 52, e.g. nvim) go to the
# outer terminal's clipboard; works through mosh (>=1.4) too.
set -s set-clipboard on

# TODO: consider breaking up some or all of this file

# Allow easy reloading of config
bind-key C-r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux.conf"

# Allows switching panes, scrolling, and copy-mode by using the mouse.
set -g mouse on

# Upgrade the $TERM type for more color support.
set -g default-terminal "tmux-256color"
set-environment -g COLORTERM truecolor

# Modern terminal features {{{

# Tell tmux what the outer terminals can do, so it passes them through to
# apps inside: 24-bit color, OSC 52 clipboard, OSC 8 hyperlinks, extended keys
# (C-Enter, S-Enter, ... as CSI u), synchronized output, styled/colored
# underlines (undercurl), cursor style/color, focus events, titles.
#
# Mosh arrives as plain xterm-256color, which already gets clipboard from the
# defaults; tmux-session exports COLORTERM=truecolor under mosh so tmux adds
# RGB. Mosh can't do the rest, so they're deliberately not claimed for it.
set -as terminal-features ',xterm-ghostty:RGB:clipboard:hyperlinks:extkeys:sync:usstyle:strikethrough:overline:ccolour:cstyle:focus:title'
set -as terminal-features ',alacritty*:RGB:clipboard:hyperlinks:extkeys:sync:usstyle:strikethrough:ccolour:cstyle:focus:title'
set -as terminal-features ',foot*:RGB:clipboard:hyperlinks:extkeys:sync:usstyle:strikethrough:overline:ccolour:cstyle:focus:title'
set -as terminal-features ',wezterm:RGB:clipboard:hyperlinks:extkeys:sync:usstyle:strikethrough:overline:ccolour:cstyle:focus:title'
set -as terminal-features ',xterm-kitty:RGB:clipboard:hyperlinks:extkeys:sync:usstyle:strikethrough:overline:ccolour:cstyle:focus:title'

# Report modified keys to apps that ask for them (nvim, Claude Code, ...).
set -s extended-keys on
set -s extended-keys-format csi-u

# Let apps notice focus changes (e.g. nvim autoread).
set -g focus-events on

# Allow apps to wrap escape sequences for the outer terminal (DCS tmux;).
set -g allow-passthrough on

# Emoji followed by VS16 are wide in modern terminals (ghostty, foot, kitty).
set -g variation-selector-always-wide on

# Outer terminal title: session and window, plus host when remote.
set -g set-titles on
set -g set-titles-string "#{?SSH_CONNECTION,#h: ,}#S: #W"

# }}}

# Disable <Esc> buffering:
# - great for vim users as it reduces latency
# - at the cost of recognizing escape sequences (such as M-* keys) as reliably
# - this shouldn't be a huge problem if you terminal emulator delivers escape
#   sequences as atomic writes
#
# Here's a good explanation of what's going on here:
#   http://catern.com/posts/terminal_quirks.html#sec-4
set -sg escape-time 0

# Allow more time for the repeat last command timer; makes resizing windows
# easier.
set -g repeat-time 1000

# Default shell and command
set -g default-shell /bin/sh
if-shell 'which reattach-to-user-namespace >/dev/null' \
    "set-option -g default-command 'reattach-to-user-namespace -l /bin/zsh'" \
    "set-option -g default-command '/bin/zsh'"

# environment variables to update automatically from latest client
set -g update-environment "DISPLAY WAYLAND_DISPLAY SSH_AUTH_SOCK"

# Keybinds {{{

bind-key * if-shell 'test "$(tmux show-options -q -v -w synchronize-panes)" == "on"' \
    'set-option -w -u synchronize-panes' \
    'set-option -w synchronize-panes on'

# Screen-like last-window binding
bind-key C-u last-window

# Screen-like last-pane binding
bind-key Tab last-pane

# Prompt for command to start a new window.
unbind-key c
bind-key c command-prompt -p command: "new-window %%"

# Saner split keybinds and prompt for command.
unbind %
unbind '"'
bind-key | command-prompt -p command: "split-window -h %%"
bind-key - command-prompt -p command: "split-window -v %%"

# Moving panes around
bind-key > choose-tree -s 'join-pane -s %%'

# Vi-style keybinds {{{
set-window-option -g mode-keys vi

# selecting panes
unbind Up
unbind Down
unbind Left
unbind Right
bind-key j select-pane -D
bind-key k select-pane -U
bind-key h select-pane -L
bind-key l select-pane -R

# resizing panes
unbind C-Up
unbind C-Down
unbind C-Left
unbind C-Right
bind-key -r J resize-pane -D
bind-key -r K resize-pane -U
bind-key -r H resize-pane -L
bind-key -r L resize-pane -R

# fast resizing panes
unbind M-Up
unbind M-Down
unbind M-Left
unbind M-Right
bind-key -r C-J resize-pane -D 5
bind-key -r C-K resize-pane -U 5
bind-key -r C-H resize-pane -L 5
bind-key -r C-L resize-pane -R 5

# }}}

# }}}

# Status line {{{

set -g status "on"
set -g status-justify "centre"
set -g status-left " #S"
set -g status-left-length 25
set -g status-right-length 25
set -g status-right "%Y-%m-%d %H:%M "

setw -g window-status-separator " "
setw -g window-status-format " #I #W "
setw -g window-status-current-format " #I #W "

# }}}

# Styles {{{

# Colors taken from darkula

set -g status-style "bg=default,fg=#666666"

set -g message-command-style "fg=#af5f00,bg=#121212"
set -g message-style "fg=#af5f00,bg=#121212"

set -g pane-active-border-style "fg=#3a3a3a,bg=default"
set -g pane-border-style "fg=#262626,bg=default"

setw -g mode-style "fg=#121212,bg=#d7af00"
# bg=default keeps the terminal's own background, and so its transparency;
# inactive panes are distinguished by dimmer default text instead.
setw -g window-style "bg=default,fg=#666666"
setw -g window-active-style "bg=default,fg=#9e9e9e"

setw -g window-status-style "fg=#9e9e9e,bg=default"
setw -g window-status-last-style "fg=#5f87af,bg=default"
setw -g window-status-current-style "fg=#5f875f,bg=default,bold"
setw -g window-status-activity-style "fg=#00af00"
setw -g window-status-bell-style "fg=#808000"

# }}}

# vim:set ft=tmux foldmethod=marker:
